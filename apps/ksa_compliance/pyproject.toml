[project]
name = "ksa_compliance"
authors = [
    { name = "SYED ZUBAIR", email = "zubairkhadri123@gmail.com"}
]
description = "Saudi Arabia ZATCA E-Invoicing (Phase 1 & Phase 2) Compliance Engine for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "requests",
    "result"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"
